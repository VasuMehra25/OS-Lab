<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OS Lab — Interactive OS Learning Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // When opened directly via file:// in Windows Explorer, redirect to local server
      if (window.location.protocol === 'file:') {
        // Attempt automatic redirect to running dev server
        setTimeout(function() {
          window.location.href = 'http://localhost:5173/#/?agentation=false';
        }, 1200);

        document.addEventListener('DOMContentLoaded', function() {
          var root = document.getElementById('root');
          if (root && !root.hasChildNodes()) {
            root.innerHTML = '<div style="font-family: Plus Jakarta Sans, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #F6FCF8; color: #0F2818; padding: 24px; text-align: center;">' +
              '<div style="background: #FFFFFF; border: 2px solid #9EE8BE; border-radius: 20px; padding: 36px 32px; max-width: 540px; box-shadow: 0 12px 36px rgba(15, 40, 24, 0.1);">' +
                '<div style="width: 52px; height: 52px; background: #DFF7EA; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-size: 26px; margin-bottom: 16px;">⚡</div>' +
                '<h2 style="font-size: 24px; font-weight: 800; margin-bottom: 12px; color: #0F2818;">Opening OS Lab...</h2>' +
                '<p style="font-size: 15px; color: #5B7A68; line-height: 1.55; margin-bottom: 24px;">Modern React web applications require a local server and cannot run directly via <code>file://</code> due to browser security policies.</p>' +
                '<a href="http://localhost:5173/#/?agentation=false" style="display: inline-block; background: #18A558; color: #FFFFFF; font-weight: 800; font-size: 16px; padding: 12px 28px; border-radius: 9999px; text-decoration: none; box-shadow: 0 4px 14px rgba(24, 165, 88, 0.35); margin-bottom: 16px;">Launch OS Lab (localhost:5173) &rarr;</a>' +
                '<p style="font-size: 13px; color: #9DB8A8;">Or double-click <strong>Open-OS-Lab.bat</strong> in this folder to start the server instantly.</p>' +
              '</div>' +
            '</div>';
          }
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
